services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: incidentiq
      POSTGRES_USER: incidentiq
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:?Run python scripts/init-env.py}
    volumes: [postgres-data:/var/lib/postgresql/data]
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U incidentiq -d incidentiq"]
      interval: 5s
      retries: 20
    mem_limit: 512m
  redis:
    image: redis:7.4-alpine
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Run python scripts/init-env.py}
    command: [sh, -c, 'exec redis-server --requirepass "$$REDIS_PASSWORD" --maxmemory 128mb --maxmemory-policy allkeys-lru']
    healthcheck:
      test: [CMD-SHELL, 'REDISCLI_AUTH="$$REDIS_PASSWORD" redis-cli ping | grep PONG']
      interval: 5s
      retries: 20
    mem_limit: 192m
  kafka:
    image: apache/kafka:3.9.1
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: 'false'
      KAFKA_HEAP_OPTS: '-Xms256m -Xmx512m'
    healthcheck:
      test: [CMD-SHELL, /opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list]
      interval: 15s
      timeout: 10s
      retries: 20
    volumes: [kafka-data:/var/lib/kafka/data]
    mem_limit: 1024m
  kafka-init:
    image: apache/kafka:3.9.1
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint: [/bin/sh, -c]
    command:
      - /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists --topic incidentiq.events.v1 --partitions 3 --replication-factor 1 && /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists --topic incidentiq.events.v1.DLT --partitions 3 --replication-factor 1
  incident-service:
    build:
      context: .
      dockerfile: Dockerfile.backend
      args:
        SERVICE: incident-service
    environment:
      SPRING_PROFILES_ACTIVE: cloud
      DATABASE_PASSWORD: ${DATABASE_PASSWORD}
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Run python scripts/init-env.py}
      VIEWER_PASSWORD: ${VIEWER_PASSWORD}
      WORKER_PASSWORD: ${WORKER_PASSWORD}
      SEED_DEMO: ${SEED_DEMO:-false}
      MANAGEMENT_TRACING_ENABLED: ${TRACING_ENABLED:-false}
      OTEL_EXPORTER_OTLP_TRACES_ENDPOINT: http://otel-collector:4318/v1/traces
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
    ports: ["127.0.0.1:8080:8080"]
    healthcheck:
      test: [CMD-SHELL, wget -q -O /dev/null http://localhost:8080/actuator/health/readiness]
      interval: 10s
      timeout: 5s
      retries: 30
    mem_limit: 1024m
  rca-worker:
    build:
      context: .
      dockerfile: Dockerfile.backend
      args:
        SERVICE: rca-worker
    environment:
      WORKER_PASSWORD: ${WORKER_PASSWORD}
      AI_BASE_URL: ${AI_BASE_URL:-https://api.openai.com/v1}
      AI_MODEL: ${AI_MODEL:-gpt-4o-mini}
      AI_API_KEY: ${AI_API_KEY:-}
      MANAGEMENT_TRACING_ENABLED: ${TRACING_ENABLED:-false}
    depends_on:
      incident-service:
        condition: service_healthy
    healthcheck:
      test: [CMD-SHELL, wget -q -O /dev/null http://localhost:8081/actuator/health/readiness]
      interval: 10s
      timeout: 5s
      retries: 30
    mem_limit: 768m
  frontend:
    build: ./frontend
    ports: ["127.0.0.1:3000:8080"]
    depends_on:
      incident-service:
        condition: service_healthy
    mem_limit: 128m
  prometheus:
    image: prom/prometheus:v3.2.1
    profiles: [observability]
    entrypoint: [/bin/sh, /bootstrap/start-prometheus.sh]
    environment:
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
    volumes:
      - ./observability/prometheus:/bootstrap:ro
      - prometheus-data:/prometheus
    ports: ["127.0.0.1:9090:9090"]
    mem_limit: 384m
  grafana:
    image: grafana/grafana:11.6.0
    profiles: [observability]
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD}
      GF_USERS_ALLOW_SIGN_UP: 'false'
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    ports: ["127.0.0.1:3001:3000"]
    mem_limit: 256m
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.123.0
    profiles: [observability]
    command: [--config=/etc/otelcol/config.yaml]
    volumes: [./observability/otel-collector.yml:/etc/otelcol/config.yaml:ro]
    depends_on: [tempo]
    mem_limit: 256m
  tempo:
    image: grafana/tempo:2.7.2
    profiles: [observability]
    command: [-config.file=/etc/tempo/config.yaml]
    volumes: [./observability/tempo.yml:/etc/tempo/config.yaml:ro, tempo-data:/tmp/tempo]
    mem_limit: 384m
volumes:
  postgres-data:
  kafka-data:
  prometheus-data:
  grafana-data:
  tempo-data:
