apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: incidentiq
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: 'true'
spec:
  ingressClassName: nginx
  tls:
    - hosts: [incidentiq.example.com]
      secretName: incidentiq-tls
  rules:
    - host: incidentiq.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend
                port: {number: 80}
