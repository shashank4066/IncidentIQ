name: Verify IncidentIQ
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true
jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - run: mvn -B -ntp verify
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: junit-reports
          path: '**/target/surefire-reports/*'
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
        working-directory: frontend
      - run: npm test && npm run build
        working-directory: frontend
      - uses: actions/upload-artifact@v4
        with:
          name: frontend-build
          path: |
            frontend/dist
            frontend/package-lock.json
  infrastructure:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: '1.11.4'
      - run: terraform -chdir=infra/terraform init -backend=false && terraform -chdir=infra/terraform validate
      - uses: azure/setup-kubectl@v4
      - run: kubectl kustomize infra/k8s/base > /tmp/incidentiq-base.yml && kubectl kustomize infra/k8s/overlays/aks > /tmp/incidentiq-aks.yml
  integration:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - run: python scripts/init-env.py
      - run: docker compose up -d --build --wait --wait-timeout 300
      - name: Exercise PostgreSQL, Redis, Kafka and RCA callback
        shell: bash
        run: |
          set -a
          source .env
          set +a
          python scripts/smoke.py
      - run: npm install --no-audit --no-fund && npx playwright install --with-deps chromium
        working-directory: frontend
      - name: Browser workflow checks
        shell: bash
        run: |
          set -a
          source .env
          set +a
          cd frontend
          npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-test-results
          path: |
            frontend/playwright-report
            frontend/test-results
      - name: Clean up test containers
        if: always()
        run: docker compose down -v
