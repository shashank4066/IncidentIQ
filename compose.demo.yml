services:
  incident-service:
    build:
      context: .
      dockerfile: Dockerfile.backend
      args:
        SERVICE: incident-service
    environment:
      SPRING_PROFILES_ACTIVE: demo
    ports: ["127.0.0.1:8080:8080"]
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:8080/actuator/health/readiness"]
      interval: 10s
      timeout: 4s
      retries: 18
    mem_limit: 768m
  frontend:
    build: ./frontend
    ports: ["127.0.0.1:3000:8080"]
    depends_on:
      incident-service:
        condition: service_healthy
    mem_limit: 128m
